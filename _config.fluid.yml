# =============================================
#  Fluid 主题核心配置
#  已配置：站点信息、导航、首页Banner、关于页、社交图标、暗色模式
# =============================================

# 全局语言
language: zh-CN

# 导航栏
navbar:
  blog_title: 锦云知夏的博客
  menu:
    - { key: '首页', link: '/', icon: 'iconfont icon-home-fill' }
    - { key: '归档', link: '/archives/', icon: 'iconfont icon-archive-fill' }
    - { key: '分类', link: '/categories/', icon: 'iconfont icon-category-fill' }
    - { key: '标签', link: '/tags/', icon: 'iconfont icon-tags-fill' }
    - { key: '关于', link: '/about/', icon: 'iconfont icon-user-fill' }

# 首页 Banner
index:
  banner_img: /img/banner.webp
  banner_img_height: 100
  slogan:
    enable: true
    text:
      - '她掌管月之彼端，你调度世上万物'
      - '调度，为了无需调度的万物。'
      - '呦呦鹿鸣，食野之苹。'
      - '风起，吹去。'
      - '月照大地，星河滚烫。'
      - '愿你我如星河般璀璨。'

# 关于页
about:
  avatar: /img/avatar.jpg
  name: 锦云知夏_Glimpse
  bio: '星月姬计划发起人 · 锦星越工作室'
  icons:
    - { class: 'iconfont icon-github-fill', link: 'https://github.com/wuhuang2', tip: 'GitHub' }
    - { class: 'iconfont icon-bilibili-fill', link: 'https://space.bilibili.com/3546734730938563', tip: 'B站' }
    - { class: 'iconfont icon-qq-fill', link: 'https://user.qzone.qq.com/3690841006', tip: 'QQ' }

# 页脚
footer:
  content: '
    <p>© 2024-2026 <a href="https://jytq.top">锦云知夏_Glimpse</a>. 保留所有权利。</p>
    <p>本站原创内容采用 <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh" target="_blank">CC BY-NC-SA 4.0</a> 许可协议。</p>
    <p><a href="https://hexo.io" target="_blank">Hexo</a> <i class="iconfont icon-love"></i> <a href="https://github.com/fluid-dev/hexo-theme-fluid" target="_blank">Fluid</a></p>
  '

# 暗色模式
dark_mode:
  enable: true
  default: auto                    # auto=跟随系统，light=始终亮色，dark=始终暗色

# 文章页
post:
  toc:
    enable: true                    # 开启文章目录
  date_format: 'YYYY-MM-DD'
  copyright:
    enable: true                    # 改为 true 开启
    license: 'BY-NC-SA'             # 许可协议类型
    author:
      enable: true                  # 显示作者
    post_date:
      enable: true                  # 显示发布日期
      format: "LL"
    update_date:
      enable: false                 # 是否显示更新日期
      format: "LL"

# 代码高亮
highlight:
  enable: true
  line_num: false
  copy_btn: true

tab_title_separator: " · "
