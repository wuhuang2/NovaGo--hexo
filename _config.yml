# Site
title: 锦云知夏的博客
subtitle: '调度，为了无需调度的万物。'
description: '星月姬计划 · 锦星越工作室 | 个人技术博客与项目驻地'
keywords: '星月姬,LUNARIS,锦云知夏,AI跨端,Hexo,开源'
author: 锦云知夏_Glimpse
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
url: https://jytq.top
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: fluid

# Deployment
deploy:
  type: ''

# =============================================
#  Fluid 主题配置（合并到主配置文件）
# =============================================

navbar:
  blog_title: 锦云知夏的博客
  menu:
    - { key: '首页', link: '/', icon: 'iconfont icon-home-fill' }
    - { key: '归档', link: '/archives/', icon: 'iconfont icon-archive-fill' }
    - { key: '分类', link: '/categories/', icon: 'iconfont icon-category-fill' }
    - { key: '标签', link: '/tags/', icon: 'iconfont icon-tags-fill' }
    - { key: '关于', link: '/about/', icon: 'iconfont icon-user-fill' }

index:
  banner_img: /img/banner.webp
  banner_img_height: 100
  slogan:
    enable: true
    text: '她掌管月之彼端，你调度世上万物'

about:
  avatar: /img/avatar.jpg
  name: 锦云知夏_Glimpse
  bio: '星月姬计划发起人 · 锦星越工作室'
  icons:
    - { class: 'iconfont icon-github-fill', link: 'https://github.com/wuhuang2', tip: 'GitHub' }
    - { class: 'iconfont icon-bilibili-fill', link: 'https://space.bilibili.com/3546734730938563', tip: 'B站' }
    - { class: 'iconfont icon-mail-fill', link: 'mailto:wuhuang13131132023@outlook.com', tip: '邮箱' }
footer:
  content: '
    <a href="https://jytq.top" target="_blank">锦云天堑工作室</a> &amp;
    <a href="https://github.com/wuhuang2" target="_blank">锦云知夏_Glimpse</a>
    <br>搭载 <a href="https://hexo.io" target="_blank">Hexo</a> 主题 <a href="https://github.com/fluid-dev/hexo-theme-fluid" target="_blank">Fluid</a>
  '

dark_mode:
  enable: true
  default: auto

post:
  toc:
    enable: true
  date_format: 'YYYY-MM-DD'